<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal</title>
<meta name="description" content="AI news, agents, research and releases. Clustered, auto-refreshing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4E1;</text></svg>">
<style>
  /* Light is the default, dark rides on [data-theme="dark"]. Every colour in
     this file is one of these tokens: no rule below may hardcode a hex value,
     or it silently stays dark in the light theme. */
  :root {
    --bg: #f2f4f7;
    --side: #ffffff;
    --card: #ffffff;
    --card-hover: #f5f7fa;
    --sunken: #eff1f6;
    --input: #ffffff;
    --raised: #ffffff;
    --hover: #eceff4;
    --hover-strong: #e2e6ee;
    --border: #dfe3ea;
    --border-soft: #e8ebf1;
    --border-hover: #c3cad6;
    --topbar: rgba(242, 244, 247, 0.9);
    --text: #131820;
    --muted: #57606f;
    --dim: #646c7a;
    --sep: #9aa3b2;
    --accent: #125cbe;
    --accent-glow: rgba(18, 92, 190, 0.09);
    --accent-soft: rgba(18, 92, 190, 0.10);
    --accent-border: rgba(18, 92, 190, 0.30);
    --accent-ring: rgba(18, 92, 190, 0.38);
    --green: #177a33;
    --green-soft: rgba(23, 122, 51, 0.11);
    --green-border: rgba(23, 122, 51, 0.32);
    --amber: #8f6000;
    --amber-soft: rgba(143, 96, 0, 0.10);
    --amber-border: rgba(143, 96, 0, 0.30);
    --violet: #6639ba;
    --briefing: #f7f9fd;
    --scrim: rgba(20, 24, 32, 0.40);
    --shadow: 0 10px 30px rgba(20, 24, 32, 0.14);
    --shadow-pop: 0 16px 44px rgba(20, 24, 32, 0.18);
    --read-opacity: 0.55;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  :root[data-theme="dark"] {
    --bg: #0a0d13;
    --side: #0d1117;
    --card: #141a24;
    --card-hover: #18202d;
    --sunken: #10161f;
    --input: #111721;
    --raised: #161d29;
    --hover: #131a26;
    --hover-strong: #202a38;
    --border: #1e2635;
    --border-soft: #171e2a;
    --border-hover: #2a3444;
    --topbar: rgba(10, 13, 19, 0.88);
    --text: #e8ebf0;
    --muted: #7d8799;
    --dim: #7d8a9e;
    --sep: #4a566a;
    --accent: #5aa9ff;
    --accent-glow: rgba(90, 169, 255, 0.10);
    --accent-soft: rgba(90, 169, 255, 0.13);
    --accent-border: rgba(90, 169, 255, 0.25);
    --accent-ring: rgba(90, 169, 255, 0.35);
    --green: #3fb950;
    --green-soft: rgba(63, 185, 80, 0.14);
    --green-border: rgba(63, 185, 80, 0.28);
    --amber: #d29922;
    --amber-soft: rgba(210, 153, 34, 0.12);
    --amber-border: rgba(210, 153, 34, 0.28);
    --violet: #a371f7;
    --briefing: #171f2e;
    --scrim: rgba(4, 6, 10, 0.55);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --shadow-pop: 0 16px 44px rgba(0, 0, 0, 0.5);
    --read-opacity: 0.42;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    min-height: 100vh;
  }

  /* ---------------- sidebar ---------------- */
  aside {
    width: 212px;
    flex-shrink: 0;
    background: var(--side);
    border-right: 1px solid var(--border-soft);
    padding: 20px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
    padding: 0 10px 4px;
  }

  .brand .sub {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--green);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  .nav-label {
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 22px 10px 7px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    background: none;
    border: none;
    color: var(--muted);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--input); color: var(--text); }
  .nav-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
  .nav-item .ico { width: 15px; text-align: center; font-size: 13px; opacity: .85; }
  .nav-item .count {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .nav-item.active .count { color: var(--accent); }

  /* System status pod. Replaces the old sidebar footer: the live line and a
     refresh button stay visible, everything else lives behind the gear. */
  .pod {
    margin-top: 18px;
    position: relative;
    padding: 10px 11px;
    background: var(--sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11.5px;
    color: var(--dim);
  }
  .pod-live { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pod-live b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pod-btns { display: flex; gap: 6px; margin-top: 9px; }
  .pod-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 0;
    border-radius: 7px;
    font-size: 11.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .pod-btn:hover { background: var(--card-hover); color: var(--text); border-color: var(--border-hover); }

  .popover {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(100% + 8px);
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 13px 14px;
    box-shadow: var(--shadow-pop);
    z-index: 40;
    display: none;
  }
  .popover.open { display: block; }
  .pop-title {
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 9px;
  }
  .pop-row { font-size: 12px; color: var(--muted); margin-bottom: 9px; }
  .pop-row b { color: var(--text); font-weight: 600; }
  .pop-hints {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid var(--border-soft);
    font-size: 11px;
    color: var(--dim);
    line-height: 1.9;
  }
  .pop-hints kbd {
    background: var(--sunken);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
  }

  /* Where read/saved marks live, plus the manual transfer controls.
     Only meaningful on a static host: with the Python server there is a real
     backend and state syncs on its own. */
  .side-state-row { cursor: help; font-size: 12px; color: var(--muted); margin-bottom: 9px; }
  .side-state-row b { color: var(--text); font-weight: 600; }
  .side-state-btns { display: flex; gap: 6px; }
  .mini {
    flex: 1;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 0;
    border-radius: 6px;
    font-size: 11px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .mini:hover { background: var(--card-hover); color: var(--text); border-color: var(--border-hover); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 14px);
    background: var(--raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: var(--shadow);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.has-act { pointer-events: auto; display: flex; align-items: center; gap: 13px; }
  .toast-act {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toast-act:hover { background: var(--accent-glow); }

  /* ---------------- main ---------------- */
  main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    transition: margin-right .28s cubic-bezier(.32, .72, .28, 1);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--topbar);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
    padding: 13px 26px;
  }

  .topbar-row { display: flex; align-items: center; gap: 12px; }

  .search { position: relative; flex: 1; max-width: 460px; }
  .search input {
    width: 100%;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 36px 9px 34px;
    border-radius: 9px;
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search input::placeholder { color: var(--dim); }
  .search .icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--dim); font-size: 13px; pointer-events: none;
  }
  .search kbd {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: var(--sunken);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 10.5px;
    color: var(--dim);
    font-family: var(--mono);
  }

  .toggle {
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 13px;
    border-radius: 9px;
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all .13s;
  }
  .toggle:hover { color: var(--text); border-color: var(--border-hover); }
  .toggle.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .status b { color: var(--muted); font-weight: 600; }

  /* Triage sub-bar: one-click signal filters, density, inbox-zero. */
  .subbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 26px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .subbar .spacer { flex: 1; min-width: 12px; }

  .qchip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 99px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all .12s;
  }
  .qchip:hover { color: var(--text); border-color: var(--border-hover); }
  .qchip.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .dens {
    display: inline-flex;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .dens button {
    background: none;
    border: none;
    color: var(--dim);
    font-size: 12.5px;
    font-family: inherit;
    padding: 4px 11px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .dens button:hover { color: var(--text); }
  .dens button.on { background: var(--hover-strong); color: var(--accent); }

  /* ---------------- filter row ---------------- */
  .filters {
    padding: 0 26px;
    border-bottom: 1px solid var(--border-soft);
    max-height: 0;
    overflow: hidden;
    transition: max-height .22s ease, padding .22s ease;
  }
  .filters.open { max-height: 190px; padding: 13px 26px; overflow-y: auto; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    margin: 0 5px 5px 0;
    transition: all .12s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-hover); }
  .chip.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--dim); font-size: 11px; }
  .chip.on .n { color: var(--accent); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  /* ---------------- content ---------------- */
  .content { flex: 1; padding: 22px 26px 60px; max-width: 980px; }

  .list { display: flex; flex-direction: column; gap: 9px; }
  .list.bento {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }

  .item {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 11px;
    padding: 15px 17px 15px 19px;
    position: relative;
    cursor: pointer;
    transition: background .13s, border-color .13s, opacity .18s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .item::before {
    content: "";
    position: absolute;
    left: 0; top: 13px; bottom: 13px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    /* Per-card source colour, set inline as --item-color by the render
       functions. The fallback only ever shows if a card ships no source. */
    background: var(--item-color, var(--accent));
    opacity: 0;
    transition: opacity .15s;
  }
  .item.unread::before { opacity: .85; }
  .item:hover { background: var(--card-hover); border-color: var(--border-hover); }
  .item.read { opacity: var(--read-opacity); }
  .item.read:hover { opacity: .72; }
  .item.focused {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* A story carried by three or more outlets reads as a briefing, not a row. */
  .item.briefing { background: linear-gradient(180deg, var(--briefing) 0%, var(--card) 96px); }
  .item.briefing::before { top: 0; bottom: 0; width: 3px; }

  .item-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 11.5px;
  }
  .src { color: var(--muted); font-weight: 600; letter-spacing: .01em; }
  .sep { color: var(--sep); }
  .when { color: var(--dim); font-variant-numeric: tabular-nums; }

  .coverage {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    padding: 1px 7px;
    border-radius: 99px;
    font-size: 10.5px;
    font-weight: 650;
  }
  .coverage.hot {
    background: var(--green-soft);
    color: var(--green);
    border-color: var(--green-border);
  }

  .pdf {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 650;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent-border);
    padding: 1px 7px;
    border-radius: 5px;
    text-decoration: none;
  }
  .pdf:hover { background: var(--accent-soft); }

  .actions {
    margin-left: auto;
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity .13s;
  }
  .item:hover .actions, .crow:hover .actions { opacity: 1; }

  .act {
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 6px;
    line-height: 1;
    transition: color .12s, background .12s;
  }
  .act:hover { color: var(--text); background: var(--hover-strong); }
  .act.on { color: var(--amber); }
  .act.done { color: var(--green); }

  .item h3 {
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -0.011em;
    line-height: 1.38;
    margin-bottom: 6px;
  }
  .item:hover h3 { color: var(--accent); }

  .item p {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Expandable coverage stack under a briefing card. */
  .cov-toggle {
    margin-top: 10px;
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 3px 11px;
    border-radius: 99px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color .12s, border-color .12s;
  }
  .cov-toggle:hover { color: var(--text); border-color: var(--accent-border); }
  .cov-toggle .chev {
    font-size: 9px;
    display: inline-block;
    transition: transform .15s ease;
  }
  .cov-toggle.open .chev { transform: rotate(90deg); }

  .cov-list {
    margin-top: 9px;
    border-left: 2px solid var(--border);
    padding-left: 13px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .cov-list[hidden] { display: none; }
  .cov-row { text-decoration: none; display: flex; gap: 10px; align-items: baseline; }
  .cov-src {
    flex: none;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
    font-weight: 650;
  }
  .cov-title { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .cov-row:hover .cov-title { color: var(--accent); }

  .abstract { margin-top: 9px; }
  .abstract summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--dim);
    font-weight: 600;
    letter-spacing: .01em;
  }
  .abstract summary:hover { color: var(--accent); }
  .abstract p {
    margin-top: 7px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* repo / release specifics */
  .meta { display: flex; align-items: center; gap: 13px; margin-top: 9px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .lang-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .pill {
    background: var(--amber-soft);
    border: 1px solid var(--amber-border);
    color: var(--amber);
    font-size: 11.5px;
    font-weight: 650;
    padding: 2px 9px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }
  .topic {
    background: var(--sunken);
    border: 1px solid var(--border);
    color: var(--dim);
    font-size: 10.5px;
    padding: 1px 8px;
    border-radius: 99px;
  }
  .ver {
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--sunken);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 5px;
    color: var(--violet);
  }
  .ver.pre { color: var(--amber); border-color: var(--amber-border); }

  .owner { color: var(--muted); font-weight: 500; }
  .slash { color: var(--dim); font-weight: 400; padding: 0 1px; }
  .name { color: var(--text); font-weight: 650; }

  .repo-tools { display: flex; gap: 6px; margin-top: 11px; opacity: .5; transition: opacity .12s; }
  .item:hover .repo-tools { opacity: 1; }
  .micro {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-size: 11px;
    font-family: inherit;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  .micro:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-glow); }

  .changelog {
    margin-top: 10px;
    background: var(--sunken);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
  }
  .changelog summary {
    cursor: pointer;

  }
  .changelog summary:hover { color: var(--text); }
  .notes { padding: 2px 13px 12px; max-height: 320px; overflow-y: auto; }
  .note-line {
    font-size: 11px;

  .note-para {

  /* ---------------- compact density ---------------- */
  .crow {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 11px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;

  .crow:hover { background: var(--card-hover); }
  .crow.read { opacity: var(--read-opacity); }
  .crow.read:hover { opacity: .75; }
  .crow.focused { background: var(--accent-glow); box-shadow: inset 0 0 0 1px var(--accent-ring); }
  .crow .cd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .crow .csrc {

    max-width: 118px;
    overflow: hidden;
    text-overflow: ellipsis;

  .crow .ct {

    min-width: 0;

  .crow.read .ct { color: var(--muted); }
  .crow .cx { flex: none; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .crow .cw { flex: none; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }

  /* ---------------- inspector ---------------- */
  .scrim {
    position: fixed;
    inset: 0;
    background: var(--scrim);

  .inspector {

  /* Wide screens get a real three-pane split: the content column gives up

</style>

<script>
const PAGE = 30;
const LANG_COLORS = {
  JavaScript:"#f1e05a", TypeScript:"#3178c6", Python:"#3572A5", Rust:"#dea584",
  Go:"#00ADD8", Shell:"#89e051", C:"#555555", "C++":"#f34b7d", "C#":"#178600",
  Java:"#b07219", Kotlin:"#A97BFF", Swift:"#F05138", Ruby:"#701516",
  PHP:"#4F5D95", HTML:"#e34c26", CSS:"#563d7c", Vue:"#41b883",
  Svelte:"#ff3e00", Dart:"#00B4AB", Lua:"#000080", Zig:"#ec915c",
  Elixir:"#6e4a7e", Scala:"#c22d40", Julia:"#a270ba", "Jupyter Notebook":"#DA5B0B"
};

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Stable id for read/saved tracking. Same string always yields the same id.
function idOf(s) {
  let h = 5389;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return "x" + h.toString(36);
}

// One colour per source. Hashed, not assigned by frequency: frequency order
// would separate the busiest sources better but reshuffles every refresh as
// counts change, and a colour that moves is worse than no colour at all.
// Thirteen vivid, hue-separated tones. Sized against the real 43-source
// corpus: 13 was the smallest palette that keeps 9 of the 10 highest-volume
// sources on distinct colours, so the busiest names rarely share a tone.
// All 13 clear WCAG AA against the dark card background (lowest 5.19:1).
const SRC_PALETTE_DARK = [
  "#ff8787", "#ffa94d", "#ffd43b", "#d4e157", "#69db7c", "#38d9a9", "#22d3ee",
  "#4dabf7", "#748ffc", "#9775fa", "#c792ea", "#e599f7", "#ff6fae"
];

// The same thirteen hues, darkened for a white card. The dark palette is
// pastel by design and several of those tones (the yellow and the lime)
// fall under 2:1 against white, so they would be unreadable in the light
// theme. Same hash, same index, same source lands on the same hue in both.
// Every entry clears 4.5:1 against white, the page, the card hover tint and
// the briefing tint, so a source name stays legible wherever it lands.
const SRC_PALETTE_LIGHT = [
  "#c92a2a", "#ba3d0b", "#ab4e08", "#4a720c", "#237a36", "#077855", "#0b7285",
  "#1864ab", "#3b5bdb", "#5f3dc4", "#862e9c", "#a21caf", "#be185d"
];

function srcColor(name) {
  const palette = THEME === "dark" ? SRC_PALETTE_DARK : SRC_PALETTE_LIGHT;
  let h = 2166136261;
  const s = String(name == null ? "" : name);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return palette[(h >>> 0) % palette.length];
}

function ago(v) {
  if (!v) return "";
  const t = new Date(v).getTime();
  if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 30) return d + "d ago";
  return Math.floor(d / 30) + "mo ago";
}

function kfmt(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "m";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return String(n);
}

let FEED = null;
let CAT = "top";
let QUERY = "";
let UNREAD_ONLY = false;
let SRC_FILTER = new Set();
const QUICK = new Set();          // "multi" | "fresh" | "high"
let DENSITY = "cards";            // "cards" | "compact"
let SHOWN = PAGE;
let FOCUS_IDX = -1;               // keyboard cursor over the rendered slice
let INSPECTOR = null;             // entry open in the right pane
let CARD_INDEX = new Map();       // _id -> entry, for the rendered slice only
let STATE = { read: new Set(), saved: new Set() };
// Mirrors <html data-theme>. Read by srcColor, which has to pick the right
// palette without touching the DOM: the test harness stubs document without
// a documentElement.
let THEME = "light";
let API = true;
// "server" = a backend is answering, state syncs on its own.
// "seeded"  = static host, fresh browser bootstrapped from a committed file.
// "local"   = static host, this browser only, and authoritative.
let STATE_MODE = "local";

const $ = id => document.getElementById(id);

/* ---------------- state ---------------- */

function readLocal() {
  try {
    return JSON.parse(localStorage.getItem("signal_state") || "{}") || {};
  } catch (e) { return {}; }
}

async function loadState() {
  // 1. Backend present. Full read and write, shared by every device that
  //    hits the same server.
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    STATE.read = new Set(d.read || []);
    STATE.saved = new Set(d.saved || []);
    API = true;
    STATE_MODE = "server";
    return;
  } catch (e) {
    API = false;
  }

  // 2. Static host (GitHub Pages). No backend can accept a write, so the
  //    browser is the only place that can hold state.
  const local = readLocal();

  if (Array.isArray(local.read) || Array.isArray(local.saved)) {
    // Local wins outright once it exists. Merging the seed in on every load
    // would mean un-marking an item silently reverts at the next reload,
    // because the seed would hand it straight back.
    STATE.read = new Set(local.read || []);
    STATE.saved = new Set(local.saved || []);
    STATE_MODE = "local";
    return;
  }

  // 3. Fresh browser. Bootstrap from a state.json committed by a server run,
  //    then absorb it so the seed only ever applies once.
  try {
    const rs = await fetch("data/state.json", { cache: "no-store" });
    if (!rs.ok) throw new Error(rs.status);
    const d = await rs.json();
    if (!Array.isArray(d.read) && !Array.isArray(d.saved)) throw new Error("shape");
    STATE.read = new Set(d.read || []);
    STATE.saved = new Set(d.saved || []);
    STATE_MODE = "seeded";
  } catch (e) {
    STATE.read = new Set();
    STATE.saved = new Set();
    STATE_MODE = "local";
  }
  writeLocal();
}

function writeLocal() {
  try {
    localStorage.setItem("signal_state", JSON.stringify({
      read: [...STATE.read], saved: [...STATE.saved]
    }));
  } catch (e) { /* private mode or quota, marks stay in memory for this session */ }
}

let saveTimer = null;
function persist() {
  if (!API) { writeLocal(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch("api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ read: [...STATE.read], saved: [...STATE.saved] })
    }).catch(() => {});
  }, 350);
}

/* ---------------- state transfer ----------------
   On a static host there is no server to POST to, so moving marks between
   devices has to be a file. Export writes one, Import merges it back. Kept
   available even with a backend, because it is also the backup. */

function exportState() {
  const stamp = new Date().toISOString().slice(0, 10);
  const payload = JSON.stringify({
    exported_at: new Date().toISOString(),
    read: [...STATE.read],
    saved: [...STATE.saved]
  }, null, 2);

  const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `signal-state-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoke on a later tick. Doing it synchronously cancels the download in
  // Safari before it has started.
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  toast(`Exported ${STATE.read.size} read, ${STATE.saved.size} saved`);
}

function importState(file) {
  const fr = new FileReader();
  fr.onerror = () => toast("Could not read that file");
  fr.onload = () => {
    let d;
    try { d = JSON.parse(String(fr.result)); }
    catch (e) { toast("That file is not valid JSON"); return; }

    if (!d || (!Array.isArray(d.read) && !Array.isArray(d.saved))) {
      toast("That is not a Signal state file");
      return;
    }

    const before = STATE.read.size + STATE.saved.size;
    (d.read || []).forEach(x => STATE.read.add(x));
    (d.saved || []).forEach(x => STATE.saved.add(x));
    const added = (STATE.read.size + STATE.saved.size) - before;

    // With a backend this pushes the merged set up to the server, which is
    // how marks hop from a static-host browser onto the shared instance.
    persist();
    renderCounts(); renderFilters(); render(); renderStatus();
    toast(added > 0 ? `Merged ${added} new marks` : "Nothing new in that file");
  };
  fr.readAsText(file);
}

/* ---------------- toast ---------------- */

let toastTimer = null;
// Optional second and third args add an action button. Only used for the one
// destructive-feeling action in the UI, where "oops" needs a way back.
function toast(msg, actionLabel, actionFn) {
  let el = $("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove("has-act");
  if (actionLabel && typeof actionFn === "function") {
    const b = document.createElement("button");
    b.className = "toast-act";
    b.textContent = actionLabel;
    b.addEventListener("click", () => {
      el.classList.remove("show");
      el.classList.remove("has-act");
      actionFn();
    });
    el.appendChild(b);
    el.classList.add("has-act");
  }
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove("show");
    el.classList.remove("has-act");
  }, actionLabel ? 6000 : 2600);
}

/* ---------------- theme ----------------
   Light is the default: the page spent its life dark-only and that is not for
   everyone. The choice is a browser preference, not feed state, so it lives
   in localStorage rather than going up to the server with the read marks. */

function applyTheme(next) {
  THEME = next === "dark" ? "dark" : "light";
  const root = document.documentElement;
  if (root && root.setAttribute) root.setAttribute("data-theme", THEME);
  try { localStorage.setItem("signal_theme", THEME); } catch (e) { /* private mode */ }

  const b = $("btn-theme");
  if (b) {
    // The button names the theme it switches to, not the one you are in.
    b.innerHTML = THEME === "dark" ? "&#9728; Day" : "&#9790; Night";
    b.title = THEME === "dark" ? "Switch to the light theme" : "Switch to the dark theme";
  }
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("signal_theme"); } catch (e) { /* private mode */ }
  applyTheme(saved === "dark" ? "dark" : "light");
}

function toggleTheme() {
  applyTheme(THEME === "dark" ? "light" : "dark");
  // Card colours come from the palette, so the whole list has to be rebuilt.
  render();
  if (INSPECTOR) renderInspector(INSPECTOR);
}

function renderStateWhere() {
  const el = $("state-where");
  if (!el) return;
  if (STATE_MODE === "server") {
    el.innerHTML = `State: <b>server</b> &middot; shared`;
    el.title = "Read and saved marks are stored on the server. Every device using this link shares them.";
  } else if (STATE_MODE === "seeded") {
    el.innerHTML = `State: <b>this browser</b> &middot; seeded`;
    el.title = "Bootstrapped from a committed state file. Marks now live in this browser only. Use Export and Import to move them to another device.";
  } else {
    el.innerHTML = `State: <b>this browser</b> only`;
    el.title = "GitHub Pages cannot store anything. Marks live in this browser only. Use Export and Import to move them to another device.";
  }
}

/* ---------------- selection ---------------- */

function allEntries() {
  if (!FEED) return { items: [], repos: [], rels: [], all: [] };
  const items = FEED.items.map(it => ({ ...it, _kind: "item", _id: idOf(it.url), _date: it.published }));
  const repos = FEED.repos.map(r => ({ ...r, _kind: "repo", _id: idOf(r.url), _date: r.updated }));
  const rels = FEED.releases.map(r => ({ ...r, _kind: "release", _id: idOf(r.url), _date: r.published }));
  return { items, repos, rels, all: [...items, ...repos, ...rels] };
}

function currentSet() {
  const e = allEntries();
  if (CAT === "saved") return e.all.filter(x => STATE.saved.has(x._id));
  if (CAT === "repos") return e.repos;
  if (CAT === "releases") return e.rels;
  if (CAT === "top") return e.items;
  return e.items.filter(x => x.category === CAT);
}

function searchHit(x) {
  if (!QUERY) return true;
  const hay = [
    x.title, x.summary, x.source, x.full_name, x.description,
    x.repo, x.tag_name, x.name, x.section, (x.topics || []).join(" ")
  ].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(QUERY);
}

// "High Signal" cuts on the ranking score, not on source weight. Every source
// in the live config carries a weight of 2 to 5, so a weight threshold of 1.2
// matches 100% of the feed and the chip would do nothing. Score blends
// recency, coverage and weight, and 5.0 sits at roughly the 85th percentile
// of a real 500-item run: about one story in six clears it.
const HIGH_SIGNAL_SCORE = 5.0;

function freshWithin(x, hours) {
  const t = new Date(x._date || "").getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) <= hours * 3600000;
}

function visible() {
  let rows = currentSet().filter(searchHit);
  if (SRC_FILTER.size) rows = rows.filter(x => !x.source || SRC_FILTER.has(x.source));
  if (UNREAD_ONLY) rows = rows.filter(x => !STATE.read.has(x._id));
  // Triage chips. A field that does not exist on this kind simply cannot
  // clear the filter, which is the right answer for repos and releases.
  if (QUICK.has("multi")) rows = rows.filter(x => (x.cluster_size || 1) >= 2);
  if (QUICK.has("fresh")) rows = rows.filter(x => freshWithin(x, 6));
  if (QUICK.has("high")) rows = rows.filter(x => Number(x.score || 0) >= HIGH_SIGNAL_SCORE);
  if (CAT === "top") rows.sort((a, b) => (b.score || 0) - (a.score || 0));
  else if (CAT !== "saved" && CAT !== "repos") {
    rows.sort((a, b) => String(b._date || "").localeCompare(String(a._date || "")));
  }
  return rows;
}

function entryById(id) {
  return CARD_INDEX.get(id) || allEntries().all.find(x => x._id === id) || null;
}

/* ---------------- rendering ---------------- */

function actionsHtml(x) {
  const saved = STATE.saved.has(x._id);
  const read = STATE.read.has(x._id);
  return `<span class="actions">
    <button class="act ${saved ? "on" : ""}" data-act="save" data-id="${x._id}" title="Save for later">${saved ? "&#9733;" : "&#9734;"}</button>
    <button class="act ${read ? "done" : ""}" data-act="read" data-id="${x._id}" title="Mark read">${read ? "&#10003;" : "&#9675;"}</button>
  </span>`;
}

function pdfUrl(x) {
  const u = String(x.url || "");
  if (!/arxiv\.org\/abs\//.test(u)) return "";
  return u.replace("arxiv.org/abs/", "arxiv.org/pdf/");
}

// The coverage stack: every outlet that carried the story, each with the
// headline it chose. The primary story leads, the merged duplicates follow.
function coverageRows(x) {
  const entries = [{ source: x.source, url: x.url, title: x.title }].concat(x.also || []);
  return entries.map(e => `<a class="cov-row" href="${esc(e.url)}" target="_blank" rel="noopener">
        <span class="cov-src" style="color:${srcColor(e.source)}">${esc(e.source)}</span>
        <span class="cov-title">${esc(e.title)}</span>
      </a>`).join("");
}

function coverageHtml(x, hidden) {
  if ((x.cluster_size || 1) < 2) return "";
  const n = (x.also || []).length;
  return `<button class="cov-toggle" data-act="cov" data-id="${x._id}">
      <span class="chev">&#x25B8;</span> ${n} more outlet${n === 1 ? "" : "s"}
    </button>
    <div class="cov-list"${hidden ? " hidden" : ""}>${coverageRows(x)}</div>`;
}

function itemCard(x) {
  const n = x.cluster_size || 1;
  const read = STATE.read.has(x._id);
  const sc = srcColor(x.source);
  const pdf = pdfUrl(x);
  const paper = !!pdf;
  const summary = x.summary || "";

  // Papers get a collapsible abstract instead of a clamped paragraph, so the
  // full thing is readable without leaving the feed.
  const body = paper && summary
    ? `<details class="abstract"><summary>Abstract</summary><p>${esc(summary)}</p></details>`
    : summary ? `<p>${esc(summary)}</p>` : "";

  return `<div class="item ${n >= 3 ? "briefing " : ""}${read ? "read" : "unread"}" data-id="${x._id}" data-url="${esc(x.url)}" style="--item-color:${sc}">
    <div class="item-top">
      <span class="src" style="color:${sc}">${esc(x.source)}</span>
      <span class="sep">&middot;</span>
      <span class="when">${ago(x.published)}</span>
      ${n > 1 ? `<span class="coverage ${n >= 5 ? "hot" : ""}">${n} outlets</span>` : ""}
      ${pdf ? `<a class="pdf" href="${esc(pdf)}" target="_blank" rel="noopener" title="Open the arXiv PDF">PDF</a>` : ""}
      ${actionsHtml(x)}
    </div>
    <h3>${esc(x.title)}</h3>
    ${body}
    ${coverageHtml(x, true)}
  </div>`;
}

function repoCard(x) {
  const color = LANG_COLORS[x.language] || "#545e70";
  const read = STATE.read.has(x._id);
  const sc = srcColor(x.section || "GitHub");
  const parts = String(x.full_name || "").split("/");
  const owner = parts[0] || x.full_name;
  const name = parts[1] || "";
  return `<div class="item repo ${read ? "read" : "unread"}" data-id="${x._id}" data-url="${esc(x.url)}" style="--item-color:${sc}">
    <div class="item-top">
      <span class="src" style="color:${sc}">${esc(x.section || "GitHub")}</span>
      <span class="sep">&middot;</span>
      <span class="when">${ago(x.updated)}</span>
      ${actionsHtml(x)}
    </div>
    <h3 class="mono"><span class="owner">${esc(owner)}</span>${name ? `<span class="slash">/</span><span class="name">${esc(name)}</span>` : ""}</h3>
    ${x.description ? `<p>${esc(x.description)}</p>` : ""}
    <div class="meta">
      <span class="pill">&#9733; ${kfmt(x.stars)}</span>
      ${x.language ? `<span><span class="lang-dot" style="background:${color}"></span>${esc(x.language)}</span>` : ""}
      ${(x.topics || []).slice(0, 3).map(t => `<span class="topic">${esc(t)}</span>`).join("")}
    </div>
    <div class="repo-tools">
      <button class="micro" data-act="copy" data-copy="${esc(x.url)}" title="Copy the repo URL">Copy URL</button>
      <button class="micro" data-act="copy" data-copy="git clone ${esc(x.url)}" title="Copy a git clone command">Clone</button>
    </div>
  </div>`;
}

// Release bodies arrive as one flat string. Split it into something a
// developer can scan: bullets become bullets, conventional-commit prefixes
// get picked out, and short label-style lines become section heads.
function formatNotes(body) {
  return String(body || "").split(/\r?\n/).map(line => {
    const l = line.trim();
    if (!l) return "";
    if (/^[-*+]\s+/.test(l)) {
      const inner = esc(l.replace(/^[-*+]\s+/, ""));
      const marked = inner.replace(
        /^(feat|fix|docs|chore|refactor|perf|test|build|ci|style|revert|release)(\([^)]*\))?(!)?:/i,
        m => `<b>${m}</b>`
      );
      return `<div class="note-li">${marked}</div>`;
    }
    // A short line with no terminal punctuation reads as a section label
    // ("What's Changed", "Full Changelog"). Anything longer is body prose.
    if (l.length <= 50 && !/[.!?,;:]$/.test(l)) {
      return `<div class="note-line">${esc(l)}</div>`;
    }
    return `<div class="note-para">${esc(l)}</div>`;
  }).join("");
}

function releaseCard(x) {
  const read = STATE.read.has(x._id);
  // Coloured by repo, not by the word "Release". Every release has the same
  // label, so keying off it would paint the whole section one colour and
  // defeat the point. The repo is the thing that actually differs.
  return `<div class="item release ${read ? "read" : "unread"}" data-id="${x._id}" data-url="${esc(x.url)}" style="--item-color:${srcColor(x.repo)}">
    <div class="item-top">
      <span class="src">Release</span>
      <span class="sep">&middot;</span>
      <span class="when">${ago(x.published)}</span>
      <span class="ver ${x.prerelease ? "pre" : ""}">${esc(x.tag_name)}</span>
      ${actionsHtml(x)}
    </div>
    <h3 class="mono">${esc(x.repo)}</h3>
    ${x.body
      ? `<details class="changelog"><summary>${esc(x.name || x.tag_name)}</summary><div class="notes">${formatNotes(x.body)}</div></details>`
      : `<p>${esc(x.name || x.tag_name)}</p>`}
  </div>`;
}

function compactRow(x) {
  const sc = srcColor(x.source || x.section || x.repo || "GitHub");
  const read = STATE.read.has(x._id);
  const title = x._kind === "repo" ? x.full_name
    : x._kind === "release" ? x.repo
    : x.title;
  const extra = x._kind === "repo" ? `<span class="cx">&#9733; ${kfmt(x.stars)}</span>`
    : x._kind === "release" ? `<span class="cx">${esc(x.tag_name)}</span>`
    : (x.cluster_size || 1) > 1 ? `<span class="cx">+${x.cluster_size - 1}</span>` : "";
  return `<div class="crow ${read ? "read" : ""}" data-id="${x._id}" style="--item-color:${sc}">
    <span class="cd" style="background:${sc}"></span>
    <span class="csrc">${esc(x.source || x.section || x.repo || "")}</span>
    <span class="ct">${esc(title)}</span>
    ${extra}
    <span class="cw">${ago(x._date)}</span>
  </div>`;
}

function cardHtml(x) {
  if (x._kind === "repo") return repoCard(x);
  if (x._kind === "release") return releaseCard(x);
  return itemCard(x);
}

function render() {
  if (!FEED) return;
  const rows = visible();
  const list = $("list");

  if (!rows.length) {
    list.innerHTML = `<div class="empty">
      <div class="big">&#x1F50D;</div>
      <h3>Nothing here</h3>
      <p>${QUERY ? `No matches for "${esc(QUERY)}".` : "This section is empty right now."}</p>
    </div>`;
    list.classList.remove("bento");
    $("more").style.display = "none";
    CARD_INDEX = new Map();
    return;
  }

  const slice = rows.slice(0, SHOWN);
  CARD_INDEX = new Map();
  slice.forEach(x => CARD_INDEX.set(x._id, x));

  let html;
  if (DENSITY === "compact") {
    html = slice.map((x, i) => {
      const row = compactRow(x);
      return i === FOCUS_IDX ? row.replace('class="crow', 'class="crow focused') : row;
    }).join("");
    list.classList.remove("bento");
  } else {
    html = slice.map((x, i) => {
      const card = cardHtml(x);
      return i === FOCUS_IDX ? card.replace('class="item', 'class="item focused') : card;
    }).join("");
    list.classList.toggle("bento", CAT === "repos");
  }

  list.innerHTML = html;

  $("more").style.display = rows.length > SHOWN ? "block" : "none";
  $("more").textContent = `Show more (${rows.length - SHOWN} remaining)`;
}

function renderCounts() {
  const e = allEntries();
  const set = (k, v) => { const el = document.querySelector(`[data-count="${k}"]`); if (el) el.textContent = v; };
  const by = c => e.items.filter(x => x.category === c).length;
  set("top", e.items.length);
  set("agents", by("agents"));
  set("news", by("news"));
  set("vendors", by("vendors"));
  set("analysis", by("analysis"));
  set("research", by("research"));
  set("community", by("community"));
  set("hardware", by("hardware"));
  set("repos", e.repos.length);
  set("releases", e.rels.length);
  set("saved", STATE.saved.size);
}

function renderFilters() {
  const rows = currentSet().filter(x => x.source);
  const counts = {};
  rows.forEach(x => { counts[x.source] = (counts[x.source] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  if (!names.length) { $("filters").innerHTML = ""; return; }
  $("filters").innerHTML =
    `<button class="chip ${SRC_FILTER.size === 0 ? "on" : ""}" data-src="__all">All sources</button>` +
    names.map(n => `<button class="chip ${SRC_FILTER.has(n) ? "on" : ""}" data-src="${esc(n)}"><span class="dot" style="background:${srcColor(n)}"></span>${esc(n)} <span class="n">${counts[n]}</span></button>`).join("");
}

function renderSubbar() {
  document.querySelectorAll("[data-quick]").forEach(b => {
    b.classList.toggle("on", QUICK.has(b.dataset.quick));
  });
  document.querySelectorAll("[data-density]").forEach(b => {
    b.classList.toggle("on", DENSITY === b.dataset.density);
  });
}

function renderStatus() {
  if (!FEED) return;
  $("foot-updated").textContent = ago(FEED.generated_at) || "just now";
  const unread = allEntries().items.filter(x => !STATE.read.has(x._id)).length;
  const s = FEED.stats || {};
  $("status").innerHTML =
    `<b>${unread}</b> unread &middot; <b>${s.items || 0}</b> stories &middot; <b>${s.sources || 0}</b> sources`;
  $("foot-sources").textContent = s.sources || 0;
}

async function pollStatus() {
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d.refreshing) { $("foot-next").textContent = "refreshing..."; return; }
    if (d.next_refresh_hours != null) {
      const h = d.next_refresh_hours;
      $("foot-next").textContent = h <= 0 ? "due now"
        : h >= 1 ? `~${Math.floor(h)}h ${Math.round((h % 1) * 60)}m`
        : `~${Math.round(h * 60)}m`;
    }
    if (d.generated_at && FEED && d.generated_at !== FEED.generated_at) {
      // server has fresher data than we loaded, pull it
      const rf = await fetch("data/feed.json", { cache: "no-store" });
      FEED = await rf.json();
      SHOWN = PAGE;
      renderCounts(); renderFilters(); render(); renderStatus();
    }
  } catch (e) {
    $("foot-next").textContent = "--";
  }
}

/* ---------------- marks ---------------- */

function refreshUI() {
  persist();
  renderCounts();
  render();
  renderStatus();
}

function toggleSaved(x) {
  if (STATE.saved.has(x._id)) STATE.saved.delete(x._id); else STATE.saved.add(x._id);
  refreshUI();
  if (INSPECTOR && INSPECTOR._id === x._id) renderInspector(INSPECTOR);
  toast(STATE.saved.has(x._id) ? "Saved" : "Removed from saved");
}

function toggleRead(x) {
  if (STATE.read.has(x._id)) STATE.read.delete(x._id); else STATE.read.add(x._id);
  refreshUI();
  if (INSPECTOR && INSPECTOR._id === x._id) renderInspector(INSPECTOR);
}

// Inbox zero for the current view. With 65+ feeds, being able to declare a
// category done in one click is the whole point, and "the current view" means
// everything passing the filters, not just the page rendered so far. On Top
// that can be several hundred marks at once, so the toast carries an undo.
function markVisibleRead() {
  const ids = visible().filter(x => !STATE.read.has(x._id)).map(x => x._id);
  if (!ids.length) { toast("Everything here is already read"); return; }
  ids.forEach(id => STATE.read.add(id));
  refreshUI();
  toast(`Marked ${ids.length} read`, "Undo", () => {
    ids.forEach(id => STATE.read.delete(id));
    refreshUI();
    toast(`Restored ${ids.length} marks`);
  });
}

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(msg);
    return;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast(msg);
    } catch (e2) { toast("Copy failed"); }
  }
}

async function forceRefresh() {
  try {
    const r = await fetch("api/refresh", { method: "POST" });
    if (!r.ok) throw new Error(r.status);
    toast("Refresh started");
    setTimeout(pollStatus, 1500);
  } catch (e) {
    toast("Refresh needs the Python server running");
  }
}

/* ---------------- inspector ---------------- */

const STOP = new Set(("a an the and or of for to in on at by with from as is are was were be been being this that these those it its into over under after before new news now more most than then when while who whom which what how why not no yes you your we our us they their he she his her i me my mine will can could may might would should does did do has have had about").split(" "));

function words(s) {
  return String(s || "").toLowerCase().split(/[^a-z0-9+#]+/).filter(w => w.length > 2 && !STOP.has(w));
}

// Pick 2-3 other entries that share rare vocabulary with this one. Rare terms
// weigh more, so two stories about "Anthropic" do not match on "release".
function relatedTo(x) {
  const mine = new Set(words(x.title || x.full_name || x.repo || ""));
  if (!mine.size) return [];
  const pool = allEntries().all.filter(y =>
    y._id !== x._id && (y.title || y.full_name || y.repo));
  if (!pool.length) return [];

  const df = new Map();
  const sets = pool.map(y => {
    const s = new Set(words(y.title || y.full_name || y.repo || ""));
    s.forEach(w => df.set(w, (df.get(w) || 0) + 1));
    return s;
  });

  const scored = pool.map((y, i) => {
    let sc = 0;
    mine.forEach(w => { if (sets[i].has(w)) sc += 1 / Math.log2(2 + (df.get(w) || 0)); });
    return { y, sc };
  }).filter(r => r.sc > 0);

  scored.sort((a, b) => b.sc - a.sc);
  return scored.slice(0, 3).map(r => r.y);
}

function labelOf(x) {
  return x._kind === "repo" ? (x.full_name || "")
    : x._kind === "release" ? (x.repo || "")
    : (x.title || "");
}

function inspectorMeta(x) {
  if (x._kind === "repo") {
    return `<span class="insp-src" style="color:${srcColor(x.section || "GitHub")}">${esc(x.section || "GitHub")}</span>
      <span class="sep">&middot;</span><span>${ago(x.updated)}</span>
      <span class="sep">&middot;</span><span>&#9733; ${kfmt(x.stars)}</span>
      ${x.language ? `<span class="sep">&middot;</span><span>${esc(x.language)}</span>` : ""}`;
  }
  if (x._kind === "release") {
    return `<span class="ver ${x.prerelease ? "pre" : ""}">${esc(x.tag_name)}</span>
      <span class="sep">&middot;</span><span>${ago(x.published)}</span>
      <span class="sep">&middot;</span><span>${esc(x.repo || "")}</span>`;
  }
  const n = x.cluster_size || 1;
  return `<span class="insp-src" style="color:${srcColor(x.source)}">${esc(x.source)}</span>
    <span class="sep">&middot;</span><span>${ago(x.published)}</span>
    ${n > 1 ? `<span class="coverage ${n >= 5 ? "hot" : ""}">${n} outlets</span>` : ""}
    ${x.score != null ? `<span class="sep">&middot;</span><span>score ${Number(x.score).toFixed(1)}</span>` : ""}`;
}

function inspectorBody(x) {
  if (x._kind === "repo") {
    return `${x.description ? `<p class="insp-summary">${esc(x.description)}</p>` : ""}
      ${(x.topics || []).length ? `<div class="insp-sec">Topics</div><div class="meta">${x.topics.slice(0, 8).map(t => `<span class="topic">${esc(t)}</span>`).join("")}</div>` : ""}`;
  }
  if (x._kind === "release") {
    return `<div class="insp-sec">Release notes</div>
      <div class="notes">${x.body ? formatNotes(x.body) : `<div class="insp-summary">No notes published for this tag.</div>`}</div>`;
  }
  const pdf = pdfUrl(x);
  const summary = x.summary ? `<p class="insp-summary">${esc(x.summary)}</p>` : "";
  const covBlock = (x.cluster_size || 1) > 1
    ? `<div class="insp-sec">Coverage &middot; ${(x.also || []).length + 1} outlets</div><div class="cov-list">${coverageRows(x)}</div>`
    : "";
  return summary + covBlock +
    (pdf ? `<div class="insp-sec">Paper</div><a class="rel" href="${esc(pdf)}" target="_blank" rel="noopener"><div class="rel-t">Open the PDF on arXiv</div><div class="rel-m">${esc(pdf)}</div></a>` : "");
}

function renderInspector(x) {
  const saved = STATE.saved.has(x._id);
  const read = STATE.read.has(x._id);
  const kind = x._kind === "repo" ? "Repo"
    : x._kind === "release" ? "Release"
    : (x.category || "Story");
  const rel = relatedTo(x);

  $("inspector").innerHTML = `
    <div class="insp-head">
      <span class="insp-kind">${esc(kind)}</span>
      <button class="insp-x" data-act="close" title="Close (Esc)">&#x2715;</button>
    </div>
    <h2 class="${x._kind === "item" ? "" : "mono"}">${esc(labelOf(x))}</h2>
    <div class="insp-meta">${inspectorMeta(x)}</div>
    ${inspectorBody(x)}
    ${rel.length ? `<div class="insp-sec">Related in this feed</div>${rel.map(r => `
      <a class="rel" data-act="goto" data-id="${r._id}">
        <div class="rel-t">${esc(labelOf(r))}</div>
        <div class="rel-m">${esc(r.source || r.section || r.repo || "")} &middot; ${ago(r._date)}</div>
      </a>`).join("")}` : ""}
    <div class="insp-actions">
      <button class="toggle" data-act="open">Open original &#8599;</button>
      <button class="act ${saved ? "on" : ""}" data-act="save" title="Save">${saved ? "&#9733;" : "&#9734;"}</button>
      <button class="act ${read ? "done" : ""}" data-act="read" title="Mark read">${read ? "&#10003;" : "&#9675;"}</button>
    </div>`;
}

function openInspector(x) {
  INSPECTOR = x;
  renderInspector(x);
  $("inspector").classList.add("open");
  $("scrim").classList.add("show");
  document.body.classList.add("insp-open");
}

function closeInspector() {
  INSPECTOR = null;
  $("inspector").classList.remove("open");
  $("scrim").classList.remove("show");
  document.body.classList.remove("insp-open");
}

/* ---------------- keyboard cursor ---------------- */

function moveFocus(delta) {
  const cards = $("list").querySelectorAll(".item, .crow");
  if (!cards.length) return;
  FOCUS_IDX = Math.max(0, Math.min(cards.length - 1, FOCUS_IDX + delta));
  for (let i = 0; i < cards.length; i++) {
    cards[i].classList.toggle("focused", i === FOCUS_IDX);
  }
  if (cards[FOCUS_IDX] && cards[FOCUS_IDX].scrollIntoView) {
    cards[FOCUS_IDX].scrollIntoView({ block: "nearest" });
  }
}

function focusedEntry() {
  const el = $("list").querySelector(".focused");
  if (!el || !el.dataset) return null;
  return entryById(el.dataset.id);
}

/* ---------------- events ---------------- */

document.querySelector("aside").addEventListener("click", e => {
  const btn = e.target.closest(".nav-item");
  if (!btn) return;
  CAT = btn.dataset.cat;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n === btn));
  SRC_FILTER.clear();
  SHOWN = PAGE;
  FOCUS_IDX = -1;
  closeInspector();
  renderFilters(); render();
});

document.querySelector(".subbar").addEventListener("click", e => {
  const q = e.target.closest("[data-quick]");
  if (q) {
    const k = q.dataset.quick;
    if (QUICK.has(k)) QUICK.delete(k); else QUICK.add(k);
    SHOWN = PAGE;
    FOCUS_IDX = -1;
    renderSubbar(); render();
    return;
  }
  const d = e.target.closest("[data-density]");
  if (d) {
    DENSITY = d.dataset.density;
    SHOWN = PAGE;
    FOCUS_IDX = -1;
    renderSubbar(); render();
  }
});

$("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const src = chip.dataset.src;
  if (src === "__all") SRC_FILTER.clear();
  else if (SRC_FILTER.has(src)) SRC_FILTER.delete(src);
  else SRC_FILTER.add(src);
  SHOWN = PAGE;
  renderFilters(); render();
});

$("list").addEventListener("click", e => {
  const act = e.target.closest(".act");
  if (act) {
    e.stopPropagation();
    const x = entryById(act.dataset.id);
    if (!x) return;
    if (act.dataset.act === "save") toggleSaved(x); else toggleRead(x);
    return;
  }

  const cov = e.target.closest(".cov-toggle");
  if (cov) {
    e.stopPropagation();
    const stack = cov.nextElementSibling;
    if (stack && stack.classList.contains("cov-list")) {
      const showing = stack.hidden;
      stack.hidden = !showing;
      cov.classList.toggle("open", showing);
    }
    return;
  }

  const micro = e.target.closest(".micro");
  if (micro) {
    e.stopPropagation();
    copyText(micro.dataset.copy || "", "Copied to clipboard");
    return;
  }

  // Anything else with an href (PDF button, coverage links) is on its way out
  // of the page already, and a <summary> toggles its own <details>.
  if (e.target.closest("a, summary, details")) return;

  const card = e.target.closest(".item, .crow");
  if (card) {
    const x = entryById(card.dataset.id);
    if (x) openInspector(x);
  }
});

$("inspector").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || !INSPECTOR) return;
  const a = b.dataset.act;
  if (a === "close") { closeInspector(); return; }
  if (a === "open") {
    STATE.read.add(INSPECTOR._id);
    refreshUI();
    window.open(INSPECTOR.url, "_blank", "noopener");
    closeInspector();
    return;
  }
  if (a === "save") { toggleSaved(INSPECTOR); return; }
  if (a === "read") { toggleRead(INSPECTOR); return; }
  if (a === "goto") {
    const x = entryById(b.dataset.id);
    if (x) { INSPECTOR = x; renderInspector(x); }
  }
});

$("scrim").addEventListener("click", closeInspector);

$("more").addEventListener("click", () => { SHOWN += PAGE; render(); });

$("q").addEventListener("input", e => {
  QUERY = e.target.value.trim().toLowerCase();
  SHOWN = PAGE;
  render();
});

$("btn-unread").addEventListener("click", () => {
  UNREAD_ONLY = !UNREAD_ONLY;
  $("btn-unread").classList.toggle("on", UNREAD_ONLY);
  SHOWN = PAGE;
  render();
});

$("btn-markread").addEventListener("click", markVisibleRead);

$("btn-filters").addEventListener("click", () => {
  const open = $("filters").classList.toggle("open");
  $("btn-filters").classList.toggle("on", open);
});

$("btn-theme").addEventListener("click", toggleTheme);

$("btn-refresh").addEventListener("click", forceRefresh);

$("btn-sync").addEventListener("click", e => {
  e.stopPropagation();
  $("sync-pop").classList.toggle("open");
});

document.addEventListener("click", e => {
  const pop = $("sync-pop");
  if (!pop.classList.contains("open")) return;
  if (!e.target.closest("#sync-pop") && !e.target.closest("#btn-sync")) {
    pop.classList.remove("open");
  }
});

document.addEventListener("keydown", e => {
  const ae = document.activeElement;
  const inField = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable);

  if (e.key === "/" && ae !== $("q")) {
    e.preventDefault(); $("q").focus(); return;
  }
  if (e.key === "Escape") {
    if (INSPECTOR) { closeInspector(); return; }
    if (ae === $("q")) { $("q").value = ""; QUERY = ""; render(); $("q").blur(); }
    return;
  }
  if (inField) return;

  if (e.shiftKey && (e.key === "M" || e.key === "m")) {
    e.preventDefault(); markVisibleRead(); return;
  }
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveFocus(1); return; }
  if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveFocus(-1); return; }
  if (ae && ae.tagName === "BUTTON") return;

  if (e.key === "Enter" || e.key === " ") {
    const x = focusedEntry();
    if (x) { e.preventDefault(); openInspector(x); }
    return;
  }
  if (e.key === "s") { const x = focusedEntry(); if (x) toggleSaved(x); return; }
  if (e.key === "m") { const x = focusedEntry(); if (x) toggleRead(x); }
});

$("btn-export").addEventListener("click", exportState);

$("btn-import").addEventListener("click", () => $("file-import").click());

$("file-import").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (f) importState(f);
  // Clear it, otherwise picking the same file twice in a row fires no event
  // the second time because the value never changed.
  e.target.value = "";
});

/* ---------------- boot ---------------- */

async function boot() {
  initTheme();
  await loadState();
  renderStateWhere();
  renderSubbar();
  try {
    const r = await fetch("data/feed.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    FEED = await r.json();
  } catch (err) {
    $("banner-slot").innerHTML = `<div class="banner">
      <h4>Could not load feed data</h4>
      ${esc(err.message)}. Generate it with <code>python3 fetch.py</code> then reload.
      If you opened this file straight from disk, the browser blocks local file reads.
      Serve the folder instead with <code>python3 server.py</code>.
    </div>`;
    $("list").innerHTML = "";
    return;
  }

  if (FEED.site && FEED.site.title) document.title = FEED.site.title;
  renderCounts(); renderFilters(); render(); renderStatus();
  pollStatus();
  setInterval(pollStatus, 60000);
  setInterval(renderStatus, 60000);
}

boot();
</script>
</body>
</html>
