name: Refresh feed

on:
  schedule:
    # Every 3 hours, offset to avoid the top-of-hour GitHub Actions rush hour.
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: refresh-feed
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    # Separate job on purpose. A failing UI test must go red without blocking
    # the feed refresh below: the data still needs to update even if the page
    # rendering it has a regression.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two suites, because the project has two languages. tests/*.test.js
      # drive the page script in a Node vm; tests/*.test.py cover fetch.py
      # ranking. Both live here, not in build-and-deploy, so a regression goes
      # red without ever blocking the feed refresh.
      - name: Run UI tests
        run: node tests/run.js

      - name: Run ranking tests
        run: python3 tests/ranking.test.py

  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch all sources
        env:
          # Built-in token. Lifts GitHub API limit from 60/hr to 1000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fetch.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          # Optional. Only present in the repo after a local server run has
          # written it. Pages can serve it as a read-only seed so a browser
          # with no marks of its own starts from somewhere. Guarded because
          # git add on a missing path is a hard error, not a no-op.
          if [ -f data/state.json ]; then git add data/state.json; fi
          if git diff --staged --quiet; then
            echo "No data change this run."
          else
            git commit -m "chore: refresh feed data [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Without this the step 404s with
          # "Get Pages site failed" on a fresh repo, because the very first run
          # is triggered by the push that creates the workflow, before Pages has
          # finished provisioning.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
